# Jenkins Configuration as Code. All secrets arrive as environment variables (see local/.env, never committed).
jenkins:
  systemMessage: "CloudOps 360 CI - configured as code"
  numExecutors: 2
  crumbIssuer: standard
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "cloudops-ro"
          password: "${JENKINS_RO_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "cloudops-ro"
            permissions:
              - "Overall/Read"
              - "Job/Read"
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub fine-grained token (contents read on app repo, read/write on GitOps repo)"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN:-}"
              description: "SonarQube analysis token"
jobs:
  - script: |
      ['orders-service', 'inventory-service', 'cloudops-backend', 'cloudops-frontend'].each { app ->
        pipelineJob(app) {
          description('CI pipeline for ' + app)
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url(System.getenv('APP_REPO_URL'))
                    credentials('github-pat')
                  }
                  branches('*/main')
                }
              }
              scriptPath('ci/jenkins/Jenkinsfile')
            }
          }
        }
      }
