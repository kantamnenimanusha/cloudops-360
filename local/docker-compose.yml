# Local CI stack: Jenkins + SonarQube (+ Postgres). Registry and kind are created by scripts/windows/03-create-cluster.ps1.
# Secrets come from local/.env (generated by 01-configure.ps1, git-ignored). Variables marked :? must be set.
name: cloudops-ci

services:
  sonarqube-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?run scripts/windows/01-configure.ps1}
      POSTGRES_DB: sonarqube
    volumes: [sonar-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db: { condition: service_healthy }
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      # Lets the embedded Elasticsearch start on Docker Desktop without raising vm.max_map_count
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      # Memory caps sized for a 16 GB laptop
      SONAR_WEB_JAVAOPTS: -Xmx512m
      SONAR_CE_JAVAOPTS: -Xmx768m
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9000:9000"]
    volumes: [sonar-data:/opt/sonarqube/data, sonar-ext:/opt/sonarqube/extensions, sonar-logs:/opt/sonarqube/logs]
    mem_limit: 3g

  jenkins:
    build: ../ci/jenkins
    container_name: cloudops-jenkins
    # root is required to use the host Docker socket from inside the container. LOCAL LAB ONLY: access to the
    # Docker socket is equivalent to root on the host. On AWS the CI server is IP-restricted (see infra/).
    user: root
    ports: ["127.0.0.1:8080:8080"]
    environment:
      JAVA_OPTS: -Xmx1g -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?run scripts/windows/01-configure.ps1}
      JENKINS_RO_PASSWORD: ${JENKINS_RO_PASSWORD:?run scripts/windows/01-configure.ps1}
      GITHUB_USER: ${GITHUB_USER:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_HOST_URL: http://sonarqube:9000
      APP_REPO_URL: ${APP_REPO_URL:?}
      GITOPS_REPO_URL: ${GITOPS_REPO_URL:?}
      KUBECONFIG: /var/jenkins_home/.kube/config
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../ci/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
    mem_limit: 2g
    depends_on: [sonarqube]

volumes:
  sonar-db:
  sonar-data:
  sonar-ext:
  sonar-logs:
  jenkins-home:
