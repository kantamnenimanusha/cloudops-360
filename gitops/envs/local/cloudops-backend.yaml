image:
  repository: localhost:5001/cloudops/cloudops-backend
  tag: "bd4ffc6b-4"
containerPort: 8000
service: { port: 8000 }
rbac: { enabled: true }
envFromSecrets: [cloudops-backend-secrets]
env:
  APP_ENV: local
  PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
  LOKI_URL: http://loki.monitoring.svc:3100
  MONITORED_NAMESPACE: cloudops
  ARGOCD_NAMESPACE: argocd
  JENKINS_JOBS: orders-service,inventory-service,cloudops-backend,cloudops-frontend
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.monitoring.svc:4318
  JENKINS_URL: http://host.docker.internal:8080
  ENABLE_AWS: "false"
