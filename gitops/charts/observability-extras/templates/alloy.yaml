apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-log-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: alloy-log-reader }
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |-
    {{- .Files.Get "files/alloy.alloy" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: cloudops-360 }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
    spec:
      serviceAccountName: alloy
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alloy
          image: {{ .Values.images.alloy }}
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy", "--server.http.listen-addr=0.0.0.0:12345"]
          ports: [{ name: http, containerPort: 12345 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.alloy | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: tmp
          emptyDir: {}
