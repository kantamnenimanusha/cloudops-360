apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |-
    {{- .Files.Get "files/loki.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: cloudops-360 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.loki | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}   # logs are NOT persisted across pod restarts (cost/complexity trade-off, see docs)
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
