env: local
destination: https://kubernetes.default.svc
gitops:
  repoURL: https://github.com/kantamnenimanusha/cloudops-360-gitops.git
  revision: main
# Helm chart version constraints for third-party charts. "*" = newest. After the first successful sync,
# PIN these to the exact versions you tested (see docs/VERSIONS.md).
charts:
  kubePrometheusStack: "*"
  metricsServer: "3.14.0"
workloads:
  - name: cloudops-backend
  - name: orders-service
  - name: inventory-service
  - name: cloudops-frontend
