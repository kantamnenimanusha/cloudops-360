
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: cloudops
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.14.0"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/envs/local/kube-prometheus-stack.yaml
    - repoURL: https://github.com/kantamnenimanusha/cloudops-360-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
